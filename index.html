<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงทะเบียนกิจกรรม CSR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; }

        @media print {
            body { background-color: #ffffff; padding: 0; margin: 0; }
            .no-print { display: none !important; }
            
            .print-layout { 
                display: flex !important;
                flex-direction: column !important;
                gap: 1.5rem !important; 
                width: 100% !important;
            }
            
            .max-w-7xl { max-width: 100% !important; width: 100% !important; }

            .print-card {
                width: 100% !important;
                page-break-inside: avoid;
                break-inside: avoid;
                border: 1px solid #cbd5e1 !important;
                box-shadow: none !important;
                border-radius: 0.75rem !important;
            }
            
            .input-section { display: none !important; }
        }
    </style>
</head>
<body class="min-h-screen py-10 px-4 sm:px-6 lg:px-8">

    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <div class="text-center mb-6">
            <span class="bg-emerald-50 text-emerald-700 text-xs font-semibold px-3 py-1.5 rounded-full uppercase tracking-wider shadow-sm">CSR Activity</span>
            <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-900 mt-3 tracking-tight">🤝 ลงทะเบียนเข้าร่วมกิจกรรม CSR</h1>
            <p class="text-slate-500 mt-2 text-sm">เลือกกลุ่มที่ต้องการและกรอกชื่อ-นามสกุลเพื่อลงทะเบียน (Real-Time)</p>
        </div>

        <!-- Print Button -->
        <div class="flex justify-center mb-10 no-print">
            <button onclick="window.print()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 px-8 rounded-xl transition duration-200 shadow-lg shadow-emerald-600/20 active:scale-[0.99] flex items-center gap-2 text-base z-10">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" /></svg>
                🖨️ พิมพ์สรุปรายชื่อลงทะเบียน (A4)
            </button>
        </div>

        <!-- Cards Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-12 print-layout" id="groups-container">
            <!-- Dynamic Cards Rendered by JS -->
        </div>
    </div>

    <script>
        const BASE_URL = "https://safety-training-ce6df-default-rtdb.firebaseio.com/csr_registrations";
        const DB_URL = `${BASE_URL}.json`;

        const GROUPS_CONFIG = [
            { id: 1, name: "บ้านเด็กชาย", leader: "คุณวรวุฒิ เรืองฤดี", max: 20, detail: "1. นำตาข่ายล้อมรอบบริเวณหลังคาด้านบน 2. ทำความสะอาดเรือนนอนชายทั้ง 2 ฝั่ง" },
            { id: 2, name: "ห้องน้ำเด็กชาย", leader: "คุณกิรติพงษ์ นาคุณ", max: 16, detail: "1. ทำความสะอาดห้องน้ำ 2. ทาสี" },
            { id: 3, name: "ห้องพยาบาล และ ศาลา", leader: "คุณอรรถพล บุษภาค", max: 6, detail: "1. ทาสีศาลา 2. ทาสีรั้วด้านนอกห้องพยาบาล" },
            { id: 4, name: "เปลี่ยนสแลน / ติดตั้งพัดลม / เปลี่ยนตาข่ายโกลฟุตบอล", leader: "คุณมงคล เสาเวียง", max: 3, detail: "1. เปลี่ยนสแลนบริเวณประตูหลัง 2. เปลี่ยนตาข่ายโกลฟุตบอลหน้าเรือนนอนหญิง 3. ติดตั้งพัดลมบริเวณหน้าห้องน้ำชาย" },
            { id: 5, name: "บันไดทางขึ้นเรือนนอนหญิง / ประตูเล้าไก่ / ประตูห้องน้ำหญิง", leader: "คุณวสันต์ ทองปลิว", max: 6, detail: "1. ซ่อมบันไดทางขึ้นเรือนนอนหญิง 2. ติดตั้งประตูเล้าไก่ใหม่ 3. ติดลูกบิดห้องน้ำหญิงใหม่ 4. ซ่อมกรอบประตูห้องน้ำหญิง" },
            { id: 6, name: "ติดตั้งป้ายมูลนิธิ", leader: "คุณพัชราภรณ์ แก้วกัญญา", max: 2, detail: "ติดตั้งป้ายมูลนิธิใหม่" },
            { id: 7, name: "ระบบไฟ", leader: "คุณสุวิทย์ พรมเวียง", max: 3, detail: "ซ่อมไฟสำนักงาน, ซ่อมไฟห้องพยาบาล, ซ่อมไฟทางเดิน และไฟด้านหลังห้องพยาบาล" },
            { id: 8, name: "กิจกรรมสันทนาการ", leader: "💖", max: 3, detail: "พาน้องๆ ร้องเพลง และทำกิจกรรมสนุกสนาม" }
        ];

        let globalData = {};
        let registeredNamesList = [];

        function initCards() {
            const container = document.getElementById('groups-container');
            let htmlContent = '';
            
            GROUPS_CONFIG.forEach(group => {
                htmlContent += `
                    <div class="bg-white rounded-2xl shadow-md border border-slate-100 overflow-hidden flex flex-col justify-between print-card" id="card-${group.id}">
                        <div>
                            <div class="bg-gradient-to-r from-emerald-600 to-teal-600 text-white p-5" id="header-${group.id}">
                                <div class="flex justify-between items-start">
                                    <h3 class="font-bold text-lg">กลุ่มที่ ${group.id}: ${escapeHtml(group.name)}</h3>
                                    <span class="text-xs bg-emerald-800 text-white px-2.5 py-1 rounded-full font-semibold whitespace-nowrap" id="status-${group.id}">
                                        0/${group.max}
                                    </span>
                                </div>
                                <p class="text-xs text-emerald-100 font-medium mt-1">👑 นำทีมโดย: ${escapeHtml(group.leader)}</p>
                                <p class="text-xs text-slate-200 opacity-90 mt-2 bg-black/10 p-2 rounded-lg">${escapeHtml(group.detail)}</p>
                            </div>

                            <ul class="p-4 divide-y divide-slate-100 text-sm text-slate-600 space-y-1 max-h-60 overflow-y-auto" id="list-${group.id}">
                                <li class="py-6 text-center text-slate-400 italic font-light">กำลังโหลดข้อมูล...</li>
                            </ul>
                        </div>

                        <div class="p-4 bg-slate-50 border-t border-slate-100 input-section">
                            <div class="flex gap-2">
                                <input type="text" id="input-${group.id}" 
                                    placeholder="กรอกชื่อ-นามสกุล" 
                                    class="w-full text-sm px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 disabled:bg-slate-200 disabled:cursor-not-allowed">
                                <button onclick="register(${group.id})" id="btn-${group.id}"
                                    class="bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-300 text-white font-semibold text-sm px-4 py-2 rounded-lg transition duration-150 whitespace-nowrap disabled:cursor-not-allowed">
                                    ลงชื่อ
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = htmlContent;
        }

        function fetchDatabase() {
            fetch(DB_URL)
                .then(res => res.json())
                .then(data => {
                    globalData = data || {};
                    updateUI();
                })
                .catch(err => console.error("Error fetching data:", err));
        }

        function updateUI() {
            registeredNamesList = [];
            let groupedMembers = {};
            GROUPS_CONFIG.forEach(g => groupedMembers[g.id] = []);

            Object.keys(globalData).forEach(key => {
                let item = globalData[key];
                if (item && item.groupId && item.name) {
                    let nameClean = item.name.trim();
                    groupedMembers[item.groupId].push({ id: key, name: nameClean });
                    registeredNamesList.push(nameClean.toLowerCase());
                }
            });

            GROUPS_CONFIG.forEach(group => {
                const members = groupedMembers[group.id] || [];
                const count = members.length;
                const isFull = count >= group.max;

                const headerEl = document.getElementById(`header-${group.id}`);
                const statusEl = document.getElementById(`status-${group.id}`);
                const listEl = document.getElementById(`list-${group.id}`);
                const inputEl = document.getElementById(`input-${group.id}`);
                const btnEl = document.getElementById(`btn-${group.id}`);

                if (!headerEl) return;

                if (isFull) {
                    headerEl.className = "bg-gradient-to-r from-slate-600 to-slate-700 text-white p-5";
                    statusEl.className = "text-xs bg-red-500 text-white px-2.5 py-1 rounded-full font-semibold whitespace-nowrap";
                    statusEl.innerText = `${count}/${group.max} (เต็ม)`;
                } else {
                    headerEl.className = "bg-gradient-to-r from-emerald-600 to-teal-600 text-white p-5";
                    statusEl.className = "text-xs bg-emerald-800 text-white px-2.5 py-1 rounded-full font-semibold whitespace-nowrap";
                    statusEl.innerText = `${count}/${group.max}`;
                }

                inputEl.disabled = isFull;
                btnEl.disabled = isFull;
                inputEl.placeholder = isFull ? "กลุ่มนี้เต็มแล้ว" : "กรอกชื่อ-นามสกุล";

                listEl.innerHTML = members.length === 0 
                    ? `<li class="py-6 text-center text-slate-400 italic font-light">ยังไม่มีผู้ลงทะเบียน</li>`
                    : members.map((m, idx) => `
                        <li class="py-2.5 flex justify-between items-center border-b border-slate-100 last:border-none">
                            <span class="font-semibold text-slate-800">${idx + 1}. ${escapeHtml(m.name)}</span>
                            <span class="text-[10px] bg-slate-100 text-slate-500 px-2 py-0.5 rounded-full font-medium">ลำดับที่ ${idx + 1}</span>
                        </li>
                    `).join('');
            });
        }

        function register(groupId) {
            const inputElement = document.getElementById(`input-${groupId}`);
            const name = inputElement.value.trim();
            const group = GROUPS_CONFIG.find(g => g.id === groupId);

            if (!name) {
                alert("กรุณากรอกชื่อ-นามสกุลก่อนลงทะเบียน");
                return;
            }

            if (registeredNamesList.includes(name.toLowerCase())) {
                alert(`คุณ "${name}" ได้ลงชื่อเข้าร่วมกิจกรรมไปแล้ว ไม่สามารถลงชื่อซ้ำได้ครับ/ค่ะ`);
                return;
            }

            fetch(DB_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    groupId: groupId,
                    groupName: group.name,
                    name: name,
                    timestamp: new Date().toISOString()
                })
            })
            .then(res => res.json())
            .then(() => {
                inputElement.value = "";
                fetchDatabase();
            })
            .catch(err => {
                alert("เกิดข้อผิดพลาดในการบันทึกข้อมูล: " + err.message);
            });
        }

        function escapeHtml(text) {
            return text.replace(/[&<>"']/g, function(m) { 
                return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]; 
            });
        }

        initCards();
        fetchDatabase();
        setInterval(fetchDatabase, 3000);
    </script>
</body>
</html>
